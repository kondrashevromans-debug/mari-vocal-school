<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/mari-vocal-school/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Упражнения трека</title>
    <link rel="stylesheet" href="style.css?v=15" />
  </head>
  <body class="page-track-detail">
    <div class="app-container">
      <header class="header-with-back-button">
        <a href="tracks.html" class="back-button">← К трекам</a>
        <h1 id="track-title">Загрузка...</h1>
      </header>

      <!-- НОВЫЙ БЛОК ПРОГРЕССА -->
      <div
        id="progress-container"
        class="progress-container"
        style="display: none"
      >
        <div class="progress-text">
          <span>Прогресс</span>
          <span id="progress-label">0/0</span>
        </div>
        <div class="progress-bar">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <main id="exercises-container" class="exercises-accordion"></main>
    </div>
    <script src="js/storage_service.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data_service.js"></script>
    <script src="js/achievements_engine.js"></script>
    <script src="js/track_detail.js"></script>
    <!-- --- HTML-КОД ДЛЯ УВЕДОМЛЕНИЯ ОБ АЧИВКЕ --- -->
    <div id="achievement-toast">
      <div class="toast-icon">🏆</div>
      <div class="toast-text-content">
        <p class="toast-main-title">Достижение получено!</p>
        <p id="toast-achievement-title">Название достижения</p>
      </div>
    </div>
    <!-- --- КОНЕЦ БЛОКА УВЕДОМЛЕНИЯ --- -->
    <script>
      window.TimeTracker.init();
    </script>
  </body>
</html>
