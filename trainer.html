<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/mari-vocal-school/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Тренажер</title>
    <link rel="stylesheet" href="style.css?v=15" />
    <link rel="stylesheet" href="tuner.css?v=15" />
    <!-- --- ИЗМЕНЕНИЕ: Стили для индикатора загрузки --- -->
    <style>
      #loading-indicator {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
        z-index: 1000;
        backdrop-filter: blur(5px);
      }
    </style>
  </head>
  <body class="page-trainer">
    <div class="header-with-back">
      <a href="trainer_menu.html" class="back-button">‹ Назад</a>
      <h2 id="trainer-title">Вокальный тренажер</h2>
    </div>
    <div class="app-container-tuner">
      <!-- --- ИЗМЕНЕНИЕ: Добавлен индикатор загрузки --- -->
      <div id="loading-indicator">Загрузка ресурсов...</div>

      <div class="output-display">
        <div id="trainer-info-area">
          <div id="trainer-instructions">Загрузка упражнения...</div>
          <div id="trainer-progress"></div>
        </div>
        <div class="note-display">
          <span id="note">--</span>
          <span id="octave"></span>
        </div>
        <div class="details-display">
          <div id="cents">Отклонение: --- cents</div>
          <div class="tuner-container">
            <div class="tuner-bar">
              <div id="tuner-indicator"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="main-content" id="main-content">
        <div class="piano-viewport">
          <div id="piano-container" class="piano-vertical"></div>
        </div>
        <div class="canvas-viewport">
          <canvas id="pitch-canvas"></canvas>
        </div>
      </div>

      <div class="controls">
        <button id="trainerStartButton">Начать упражнение</button>
        <button id="trainerStopButton" class="hidden">Остановить</button>
      </div>
    </div>

    <div id="results-modal" class="modal-backdrop hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Упражнение завершено!</h2>
        </div>
        <div id="results-content" class="stats-list">
          <!-- Результаты будут здесь -->
        </div>
        <div class="results-actions">
          <button id="restart-button">Попробовать еще раз</button>
          <button id="back-to-menu-button">К меню тренажеров</button>
        </div>
      </div>
    </div>

    <script src="js/storage_service.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data_service.js"></script>
    <script src="js/achievements_engine.js"></script>
    <!-- --- ИЗМЕНЕНИЕ: Подключен сервис для звуков пианино --- -->
    <script src="js/piano_sound_service.js"></script>
    <script src="js/trainer.js?v=12" defer></script>
    <!-- --- HTML-КОД ДЛЯ УВЕДОМЛЕНИЯ ОБ АЧИВКЕ --- -->
    <div id="achievement-toast">
      <div class="toast-icon">🏆</div>
      <div class="toast-text-content">
        <p class="toast-main-title">Достижение получено!</p>
        <p id="toast-achievement-title">Название достижения</p>
      </div>
    </div>
    <!-- --- КОНЕЦ БЛОКА УВЕДОМЛЕНИЯ --- -->
    <script>
      window.TimeTracker.init();
    </script>
  </body>
</html>
