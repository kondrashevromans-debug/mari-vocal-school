<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/mari-vocal-school/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Ежедневная практика</title>
    <link rel="stylesheet" href="style.css?v=15" />
  </head>
  <body class="page-daily-practice">
    <div class="app-container">
      <header class="header-with-back-button">
        <a href="tracks.html" class="back-button">← К Упражнениям</a>
        <h1>Чек-лист на сегодня</h1>
      </header>

      <main id="daily-practice-container"></main>

      <div id="daily-practice-footer" class="daily-practice-footer">

        <button id="complete-daily-button" class="complete-daily-button">
          Я выполнил(а) комплекс!
        </button>
      </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/data_service.js"></script>
    <script src="js/achievements_engine.js"></script>
    <script src="js/daily_practice.js"></script>
    <!-- --- HTML-КОД ДЛЯ УВЕДОМЛЕНИЯ ОБ АЧИВКЕ --- -->
    <div id="achievement-toast">
      <div class="toast-icon">🏆</div>
      <div class="toast-text-content">
        <p class="toast-main-title">Достижение получено!</p>
        <p id="toast-achievement-title">Название достижения</p>
      </div>
    </div>
    <!-- --- КОНЕЦ БЛОКА УВЕДОМЛЕНИЯ --- -->
    <script>
      window.TimeTracker.init();
    </script>
